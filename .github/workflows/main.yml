name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod install

      - name: List Schemes
        run: |
          xcodebuild -list -workspace ICO-Visualizer.xcworkspace
