name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          sed -i '' 's/platform :ios.*/platform :ios, '\''12.0'\''/' Podfile || true
          pod install

      - name: Build App
        run: |
          xcodebuild \
            -workspace ICO-Visualizer.xcworkspace \
            -scheme ICO-visualizer \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            build
